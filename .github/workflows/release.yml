name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史以生成 changelog

      - name: Get version
        id: version
        run: |
          echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_NUM="${VERSION#v}"  # 移除 v 前缀

          cat > release_notes.md << EOF
          ## 🚀 ConfigFlow ${VERSION}

          ### 📦 Docker 版本

          \`\`\`bash
          # Docker Hub
          docker pull thsrite/config-flow:${VERSION_NUM}
          docker pull thsrite/config-flow:latest

          # 快速启动
          docker run -d \\
            -p 80:80 \\
            -v ./data:/data \\
            --name config-flow \\
            thsrite/config-flow:latest
          \`\`\`

          ### ✨ 更新内容

          EOF

          # 获取上一个 tag
          PREV_TAG=$(git describe --tags --abbrev=0 ${VERSION}^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            echo "#### 提交历史" >> release_notes.md
            echo "" >> release_notes.md
            git log ${PREV_TAG}..${VERSION} --pretty=format:"- %s (%h)" --no-merges >> release_notes.md
            echo "" >> release_notes.md
            echo "" >> release_notes.md
          fi

          # 添加完整更新日志链接
          if [ -f CHANGELOG.md ]; then
            echo "📝 查看完整更新日志：[CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)" >> release_notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
