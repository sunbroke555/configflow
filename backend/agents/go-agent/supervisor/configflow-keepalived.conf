[program:configflow-keepalived]
command=/usr/sbin/keepalived -P --dont-fork --log-console --use-file=/var/lib/configflow-ha/keepalived.conf --pid=/run/configflow-ha.pid --vrrp_pid=/run/configflow-ha-vrrp.pid
user=root
; The Agent starts this program only after verifying its persistent HA journal.
autostart=false
autorestart=true
startsecs=1
startretries=3
; Supervisor stops higher priorities first, before the Agent (99) and core (10).
priority=110
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
