runtime:
  worker_threads: 2
api:
  http:
    listen: 127.0.0.1:9199
log:
  level: info
plugins:
- tag: rules_domain_1
  type: domain_set
  args:
    exps:
    - domain:example.test
- tag: rules_domain_2
  type: domain_set
  args:
    exps:
    - full:x.example.test
- tag: rules_domain_3
  type: domain_set
  args:
    exps:
    - keyword:ads
    files:
    - ./rules/rule_e8bc163c82eee187_domain.txt
- tag: rules_domain_4
  type: domain_set
  args:
    files:
    - ./rules/rule_ad328846aa18b32a_domain.txt
- tag: rules_ip_1
  type: ip_set
  args:
    ips:
    - 203.0.113.0/24
- tag: rules_ip_2
  type: ip_set
  args:
    ips:
    - 2001:db8::/32
    files:
    - ./rules/rule_ad328846aa18b32a_ip.txt
    - ./rules/rule_41242b9fae56fad4_ip.txt
- tag: custom_hosts
  type: hosts
  args:
    files:
    - ./rules/custom_hosts.txt
- tag: lazy_cache
  type: cache
  args:
    size: 10240
    lazy_cache_ttl: 300
    short_circuit: true
- tag: local_probe_cache
  type: cache
  args:
    size: 2048
    short_circuit: false
- tag: forward_local
  type: forward
  args:
    concurrent: 2
    upstreams:
    - addr: udp://223.5.5.5
    - addr: udp://119.29.29.29
- tag: forward_remote
  type: forward
  args:
    concurrent: 1
    upstreams:
    - addr: https://1.1.1.1/dns-query
    - addr: https://8.8.8.8/dns-query
- tag: china_dns
  type: sequence
  args:
  - exec: $lazy_cache
  - exec: $forward_local
  - matches:
    - '!has_resp'
    exec: reject 3
- tag: local_probe
  type: sequence
  args:
  - exec: $local_probe_cache
  - matches:
    - '!has_resp'
    exec: $forward_local
  - exec: return
- tag: remote_dns
  type: sequence
  args:
  - exec: $forward_remote
  - matches:
    - '!has_resp'
    exec: reject 3
  - exec: ttl 1
- tag: proxy_dns_seq
  type: sequence
  args:
  - exec: goto remote_dns
- tag: default_direct_ip
  type: sequence
  args:
  - exec: accept
- tag: direct_ip
  type: sequence
  args:
  - exec: accept
- tag: ip_requery_proxy
  type: sequence
  args:
  - exec: drop_resp
  - exec: goto proxy_dns_seq
- tag: sequence_main
  type: sequence
  args:
  - exec: metrics_collector metrics
  - exec: prefer_ipv4
  - matches:
    - qtype 65
    exec: black_hole nodata short_circuit=true
  - exec: $custom_hosts
  - matches:
    - has_resp
    exec: accept
  - matches:
    - qname domain:corp.test
    exec: goto china_dns
  - matches:
    - qname $rules_domain_1
    exec: goto china_dns
  - matches:
    - qname $rules_domain_2
    exec: goto proxy_dns_seq
  - matches:
    - qname $rules_domain_3
    exec: goto china_dns
  - matches:
    - qname $rules_domain_4
    exec: goto proxy_dns_seq
  - exec: jump local_probe
  - matches:
    - resp_ip $rules_ip_1
    exec: goto direct_ip
  - matches:
    - resp_ip $rules_ip_2
    exec: goto ip_requery_proxy
  - exec: drop_resp
  - exec: goto proxy_dns_seq
- tag: server_udp
  type: udp_server
  args:
    listen: 0.0.0.0:53
    entry: sequence_main
- tag: server_tcp
  type: tcp_server
  args:
    listen: 0.0.0.0:53
    entry: sequence_main
- tag: rules_download
  type: download
  args:
    timeout: 60s
    downloads:
    - url: https://config.test/api/mosdns/rule-proxy?url=https%3A%2F%2Frules.test%2Fcn&part=domain&token=fixture-token
      dir: rules
      filename: rule_e8bc163c82eee187_domain.txt
    - url: https://config.test/api/mosdns/rule-proxy?url=https%3A%2F%2Fconfig.test%2Fapi%2Frule-library%2Fcontent%2Fs2&part=domain&token=fixture-token
      dir: rules
      filename: rule_ad328846aa18b32a_domain.txt
    - url: https://config.test/api/mosdns/rule-proxy?url=https%3A%2F%2Fconfig.test%2Fapi%2Frule-library%2Fcontent%2Fs2&part=ip&token=fixture-token
      dir: rules
      filename: rule_ad328846aa18b32a_ip.txt
    - url: https://config.test/api/mosdns/rule-proxy?url=https%3A%2F%2Frules.test%2Fip&part=ip&token=fixture-token
      dir: rules
      filename: rule_41242b9fae56fad4_ip.txt
- tag: rules_reload
  type: reload_provider
  args:
  - $rules_domain_1
  - $rules_domain_2
  - $rules_domain_3
  - $rules_domain_4
  - $rules_ip_1
  - $rules_ip_2
- tag: rules_refresh
  type: sequence
  args:
  - exec: $rules_download
  - exec: $rules_reload
