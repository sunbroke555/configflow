runtime:
  worker_threads: 2
api:
  http:
    listen: 127.0.0.1:9199
log:
  level: info
  file: ./oxidns.log
  rotation:
    type: daily
    max_files: 7
plugins:
- tag: rules_domain_1
  type: domain_set
  args:
    exps:
    - domain:example.test
- tag: rules_domain_2
  type: domain_set
  args:
    exps:
    - full:x.example.test
- tag: rules_domain_3
  type: domain_set
  args:
    exps:
    - keyword:ads
- tag: rules_domain_4
  type: domain_set
  args:
    files:
    - ./rules/rule_e8bc163c82eee187_domain.txt
- tag: rules_domain_5
  type: domain_set
  args:
    files:
    - ./rules/rule_ad328846aa18b32a_domain.txt
- tag: rules_ip_1
  type: ip_set
  args:
    ips:
    - 203.0.113.0/24
- tag: rules_ip_2
  type: ip_set
  args:
    ips:
    - 2001:db8::/32
- tag: rules_ip_3
  type: ip_set
  args:
    files:
    - ./rules/rule_ad328846aa18b32a_ip.txt
- tag: rules_ip_4
  type: ip_set
  args:
    files:
    - ./rules/rule_41242b9fae56fad4_ip.txt
- tag: custom_hosts
  type: hosts
  args:
    files:
    - ./rules/custom_hosts.txt
- tag: lazy_cache
  type: cache
  args:
    size: 10240
    short_circuit: true
- tag: local_probe_cache
  type: cache
  args:
    size: 2048
    short_circuit: false
- tag: forward_local
  type: forward
  args:
    concurrent: 2
    upstreams:
    - addr: udp://10.0.0.1
    - addr: udp://10.0.0.2
- tag: forward_remote
  type: forward
  args:
    concurrent: 1
    upstreams:
    - addr: https://1.1.1.1/dns-query
      bootstrap: 223.5.5.5
- tag: forward_fallback
  type: forward
  args:
    concurrent: 2
    upstreams:
    - addr: udp://9.9.9.9
- tag: dynamic_domains
  type: dynamic_domain_set
  args:
    path: ./state/learned-domains.txt
    bootstrap_rules: []
    queue_size: 1024
    batch_size: 256
    flush_interval_ms: 200
- tag: learn_classified_domain
  type: learn_domain
  args:
    phase: after
    questions: first
    qtypes:
    - A
    - AAAA
    success_only: true
    answer_required: true
    rule_kind: full
    async: true
    error_mode: continue
    timeout: 1s
    provider: dynamic_domains
- tag: query_recorder
  type: query_recorder
  args:
    path: ./state/queries.db
    queue_size: 8192
    batch_size: 256
    flush_interval_ms: 200
    memory_tail: 1024
    retention_days: 7
    cleanup_interval_hours: 1
    reader_concurrency: 2
- tag: ip_selector
  type: ip_selector
  args:
    selection_mode: background
    probe_methods:
    - tcp:443
    - tcp:80
    probe_stagger: 200
    probe_timeout: 600
    max_wait: 1000
    top_n: 0
    dnssec_policy: reorder_only
    max_parallel_probes: 64
    cache:
      enabled: true
      size: 4096
      ttl: 3600
      failure_ttl: 60
- tag: ros_address_list
  type: ros_address_list
  args:
    address: 192.168.88.1
    username: u
    password: p
    async: true
    address_list4: oxidns
    address_list6: oxidns
    min_ttl: 60
    max_ttl: 3600
    queue_capacity: 16384
    comment_prefix: configflow
    cleanup_on_shutdown: true
- tag: adguard_rules
  type: adguard_rule
  args:
    files:
    - ./rules/adguard_33c9068985fd1b00.txt
- tag: adguard_block
  type: black_hole
  args:
    mode: nxdomain
- tag: adguard_reject
  type: sequence
  args:
  - exec: $adguard_block
  - exec: accept
- tag: china_dns
  type: sequence
  args:
  - exec: $ip_selector
  - exec: $ros_address_list
  - exec: $lazy_cache
  - exec: $forward_local
  - matches:
    - '!has_resp'
    exec: reject 3
- tag: local_probe
  type: sequence
  args:
  - exec: $local_probe_cache
  - matches:
    - '!has_resp'
    exec: $forward_local
  - exec: return
- tag: remote_dns
  type: sequence
  args:
  - exec: $forward_remote
  - matches:
    - '!has_resp'
    exec: reject 3
  - exec: ttl 60
- tag: fallback_dns
  type: sequence
  args:
  - exec: $forward_fallback
  - matches:
    - '!has_resp'
    exec: reject 3
- tag: fallback
  type: fallback
  args:
    primary: remote_dns
    secondary: fallback_dns
    threshold: 500
    always_standby: false
- tag: proxy_dns_seq
  type: sequence
  args:
  - exec: $fallback
  - exec: accept
- tag: default_direct_ip
  type: sequence
  args:
  - exec: $ip_selector
  - exec: $ros_address_list
  - exec: accept
- tag: direct_ip
  type: sequence
  args:
  - exec: $ip_selector
  - exec: $ros_address_list
  - exec: accept
- tag: ip_requery_proxy
  type: sequence
  args:
  - exec: drop_resp
  - exec: $learn_classified_domain
  - exec: goto proxy_dns_seq
- tag: sequence_main
  type: sequence
  args:
  - exec: metrics_collector metrics
  - exec: $query_recorder
  - exec: prefer_ipv4
  - matches:
    - qtype 65
    exec: black_hole nodata short_circuit=true
  - exec: $custom_hosts
  - matches:
    - has_resp
    exec: accept
  - matches:
    - question $adguard_rules
    exec: goto adguard_reject
  - exec: jump cf_device_policy
  - matches:
    - qname $rules_domain_1
    exec: goto china_dns
  - matches:
    - qname $rules_domain_2
    exec: goto proxy_dns_seq
  - matches:
    - qname $rules_domain_3
    exec: goto china_dns
  - matches:
    - qname $rules_domain_4
    exec: goto china_dns
  - matches:
    - qname $rules_domain_5
    exec: goto proxy_dns_seq
  - matches:
    - qname domain:corp.test
    exec: goto china_dns
  - matches:
    - qname $dynamic_domains
    exec: goto proxy_dns_seq
  - exec: jump local_probe
  - matches:
    - resp_ip $rules_ip_1
    exec: goto direct_ip
  - matches:
    - resp_ip $rules_ip_2
    exec: goto ip_requery_proxy
  - matches:
    - resp_ip $rules_ip_3
    exec: goto ip_requery_proxy
  - matches:
    - resp_ip $rules_ip_4
    exec: goto ip_requery_proxy
  - matches:
    - has_resp
    exec: goto default_direct_ip
  - exec: goto china_dns
- tag: server_udp
  type: udp_server
  args:
    listen: 0.0.0.0:53
    entry: sequence_main
- tag: server_tcp
  type: tcp_server
  args:
    listen: 0.0.0.0:53
    entry: sequence_main
- tag: rules_download
  type: download
  args:
    timeout: 60s
    downloads:
    - url: https://config.test/api/mosdns/rule-proxy?url=https%3A%2F%2Frules.test%2Fcn&part=domain&token=fixture-token
      dir: rules
      filename: rule_e8bc163c82eee187_domain.txt
    - url: https://config.test/api/mosdns/rule-proxy?url=https%3A%2F%2Fconfig.test%2Fapi%2Frule-library%2Fcontent%2Fs2&part=domain&token=fixture-token
      dir: rules
      filename: rule_ad328846aa18b32a_domain.txt
    - url: https://config.test/api/mosdns/rule-proxy?url=https%3A%2F%2Fconfig.test%2Fapi%2Frule-library%2Fcontent%2Fs2&part=ip&token=fixture-token
      dir: rules
      filename: rule_ad328846aa18b32a_ip.txt
    - url: https://config.test/api/mosdns/rule-proxy?url=https%3A%2F%2Frules.test%2Fip&part=ip&token=fixture-token
      dir: rules
      filename: rule_41242b9fae56fad4_ip.txt
    - url: https://rules.test/adguard.txt
      dir: rules
      filename: adguard_33c9068985fd1b00.txt
- tag: rules_reload
  type: reload_provider
  args:
  - $rules_domain_1
  - $rules_domain_2
  - $rules_domain_3
  - $rules_domain_4
  - $rules_domain_5
  - $rules_ip_1
  - $rules_ip_2
  - $rules_ip_3
  - $rules_ip_4
  - $adguard_rules
- tag: rules_refresh
  type: sequence
  args:
  - exec: $rules_download
  - exec: $rules_reload
- tag: rules_cron
  type: cron
  args:
    timezone: Asia/Shanghai
    jobs:
    - name: refresh_rules
      schedule: 30 3 * * *
      executors:
      - $rules_refresh
- tag: cf_device_policy
  type: sequence
  args:
  - matches:
    - client_ip 192.168.1.10
    exec: goto cf_device_direct
  - exec: return
- tag: cf_device_direct
  type: sequence
  args:
  - exec: $forward_local
  - matches:
    - '!has_resp'
    exec: reject 3
  - exec: accept
