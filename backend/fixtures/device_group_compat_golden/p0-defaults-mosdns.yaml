log:
  level: info
  file: ./mosdns.log
api:
  http: 0.0.0.0:8338
plugins:
  - tag: lazy_cache
    type: cache
    args:
      size: 10240
      lazy_cache_ttl: 21600
      dump_file: ./cache.dump
      dump_interval: 300
  - tag: forward_local
    type: forward
    args:
      concurrent: 10
      upstreams:
        - addr: 223.5.5.5
        - addr: 119.29.29.29
  - tag: forward_remote
    type: forward
    args:
      concurrent: 5
      upstreams:
        - addr: https://1.1.1.1/dns-query
        - addr: https://dns.google/dns-query
  - tag: forward_remote_fallback
    type: forward
    args:
      concurrent: 10
      upstreams:
        - addr: 223.5.5.5
        - addr: 119.29.29.29
  - tag: remote_dns
    type: sequence
    args:
      - exec: query_summary forward_remote
      - exec: $forward_remote
      - matches:
          - '!has_resp'
        exec: reject 3
      - exec: ttl 1
  - tag: remote_dns_fallback
    type: sequence
    args:
      - exec: query_summary forward_remote_fallback
      - exec: $forward_remote_fallback
      - matches:
          - '!has_resp'
        exec: reject 3
  - tag: proxy_dns
    type: fallback
    args:
      primary: remote_dns
      secondary: remote_dns_fallback
      threshold: 500
      always_standby: false
  - tag: proxy_dns_seq
    type: sequence
    args:
      - exec: $proxy_dns
      - exec: accept
  - tag: china_dns
    type: sequence
    args:
      - exec: $lazy_cache
      - matches:
          - has_resp
        exec: accept
      - exec: query_summary forward_local
      - exec: $forward_local
      - matches:
          - '!has_resp'
        exec: reject 3
  - tag: sequence_main
    type: sequence
    args:
      - exec: metrics_collector metrics
      - exec: prefer_ipv4
      - exec: goto proxy_dns_seq
  - type: udp_server
    args:
      entry: sequence_main
      listen: :53
  - type: tcp_server
    args:
      entry: sequence_main
      listen: :53
