# Generated by ConfigFlow for Loon

[General]
loglevel = notify

[Proxy]

[Remote Proxy]

[Remote Filter]

[Proxy Group]
节点选择 = select,DIRECT

[Rule]
DOMAIN-SUFFIX,example.test,节点选择
DOMAIN,refused.example.test,REJECT
DOMAIN,missing.example.test,REJECT
DOMAIN,empty.example.test,REJECT-DROP
DOMAIN-KEYWORD,ads,REJECT
DOMAIN,pinned.example.test,DIRECT
IP-CIDR,192.0.2.0/24,DIRECT,no-resolve
IP-CIDR6,2001:db8::/32,节点选择,no-resolve
DOMAIN,after.example.test,REJECT
FINAL,节点选择

[Remote Rule]
# Loon 不支持 YAML/MRS 规则集，已忽略: 广告规则 https://rules.test/ads.yaml
# Loon 不支持 YAML/MRS 规则集，已忽略: mixed https://rules.test/mixed.yaml
https://rules.test/networks.txt,policy=DIRECT,tag=networks,enabled=true

[Host]
nas.test = 192.168.50.2
