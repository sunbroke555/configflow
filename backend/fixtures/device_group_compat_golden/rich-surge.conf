#!MANAGED-CONFIG https://config.test/api/config/golden-space/surge interval=86400 strict=true

[General]
loglevel = notify

[Proxy]

[Proxy Group]
节点选择 = select, DIRECT

[Rule]
DOMAIN-SUFFIX,example.test,节点选择
DOMAIN,refused.example.test,REJECT
DOMAIN,missing.example.test,REJECT
DOMAIN,empty.example.test,REJECT-DROP
DOMAIN-KEYWORD,ads,REJECT
DOMAIN,pinned.example.test,DIRECT
IP-CIDR,192.0.2.0/24,DIRECT,no-resolve
IP-CIDR6,2001:db8::/32,节点选择,no-resolve
RULE-SET,https://rules.test/ads.yaml,REJECT,rule-set-format=yaml
RULE-SET,https://rules.test/mixed.yaml,节点选择,no-resolve,rule-set-format=yaml
RULE-SET,https://rules.test/networks.txt,DIRECT,no-resolve
FINAL,节点选择
DOMAIN,after.example.test,REJECT

[Host]
nas.test = 192.168.50.2