runtime:
  worker_threads: 2
api:
  http:
    listen: 127.0.0.1:9199
log:
  level: info
plugins:
- tag: lazy_cache
  type: cache
  args:
    size: 10240
    lazy_cache_ttl: 300
    short_circuit: true
- tag: local_probe_cache
  type: cache
  args:
    size: 2048
    short_circuit: false
- tag: forward_local
  type: forward
  args:
    concurrent: 2
    upstreams:
    - addr: udp://223.5.5.5
    - addr: udp://119.29.29.29
- tag: forward_remote
  type: forward
  args:
    concurrent: 1
    upstreams:
    - addr: https://1.1.1.1/dns-query
    - addr: https://8.8.8.8/dns-query
- tag: china_dns
  type: sequence
  args:
  - exec: $lazy_cache
  - exec: $forward_local
  - matches:
    - '!has_resp'
    exec: reject 3
- tag: local_probe
  type: sequence
  args:
  - exec: $local_probe_cache
  - matches:
    - '!has_resp'
    exec: $forward_local
  - exec: return
- tag: remote_dns
  type: sequence
  args:
  - exec: $forward_remote
  - matches:
    - '!has_resp'
    exec: reject 3
  - exec: ttl 1
- tag: proxy_dns_seq
  type: sequence
  args:
  - exec: goto remote_dns
- tag: default_direct_ip
  type: sequence
  args:
  - exec: accept
- tag: direct_ip
  type: sequence
  args:
  - exec: accept
- tag: ip_requery_proxy
  type: sequence
  args:
  - exec: drop_resp
  - exec: goto proxy_dns_seq
- tag: sequence_main
  type: sequence
  args:
  - exec: metrics_collector metrics
  - exec: prefer_ipv4
  - matches:
    - qtype 65 255
    exec: black_hole nodata short_circuit=true
  - exec: goto proxy_dns_seq
- tag: server_udp
  type: udp_server
  args:
    listen: 0.0.0.0:53
    entry: sequence_main
- tag: server_tcp
  type: tcp_server
  args:
    listen: 0.0.0.0:53
    entry: sequence_main
