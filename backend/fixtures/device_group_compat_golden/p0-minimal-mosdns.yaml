log:
  level: info
  file: ./mosdns.log
api:
  http: 0.0.0.0:8338
plugins:
  - tag: cn
    type: domain_set
    args:
      files:
        - ./rules/cn.txt
  - tag: mixed
    type: domain_set
    args:
      files:
        - ./rules/mixed.txt
  - tag: mixed_ip
    type: ip_set
    args:
      files:
        - ./rules/mixed_ip.txt
  - tag: ips
    type: ip_set
    args:
      files:
        - ./rules/ips.txt
  - tag: forward_local
    type: forward
    args:
      concurrent: 10
      upstreams:
        - addr: 223.5.5.5
        - addr: 119.29.29.29
  - tag: forward_remote
    type: forward
    args:
      concurrent: 5
      upstreams:
        - addr: https://1.1.1.1/dns-query
        - addr: https://dns.google/dns-query
  - tag: forward_remote_fallback
    type: forward
    args:
      concurrent: 10
      upstreams:
        - addr: 223.5.5.5
        - addr: 119.29.29.29
  - tag: remote_dns
    type: sequence
    args:
      - exec: query_summary forward_remote
      - exec: $forward_remote
      - matches:
          - '!has_resp'
        exec: reject 3
      - exec: ttl 1
  - tag: remote_dns_fallback
    type: sequence
    args:
      - exec: query_summary forward_remote_fallback
      - exec: $forward_remote_fallback
      - matches:
          - '!has_resp'
        exec: reject 3
  - tag: proxy_dns
    type: fallback
    args:
      primary: remote_dns
      secondary: remote_dns_fallback
      threshold: 500
      always_standby: false
  - tag: proxy_dns_seq
    type: sequence
    args:
      - exec: $proxy_dns
      - exec: accept
  - tag: china_dns
    type: sequence
    args:
      - exec: query_summary forward_local
      - exec: $forward_local
      - matches:
          - '!has_resp'
        exec: reject 3
  - tag: direct_rules
    type: domain_set
    args:
      files:
        - ./rules/direct_rules.txt
  - tag: proxy_rules
    type: domain_set
    args:
      files:
        - ./rules/proxy_rules.txt
  - tag: direct_rules_2
    type: domain_set
    args:
      files:
        - ./rules/direct_rules_2.txt
  - tag: direct_ip_rules
    type: ip_set
    args:
      files:
        - ./rules/direct_ip_rules.txt
  - tag: proxy_ip_rules
    type: ip_set
    args:
      files:
        - ./rules/proxy_ip_rules.txt
  - tag: ip_requery_proxy
    type: sequence
    args:
      - exec: drop_resp
      - exec: goto proxy_dns_seq
  - tag: sequence_main
    type: sequence
    args:
      - exec: metrics_collector metrics
      - exec: prefer_ipv4
      - matches:
          - qname $direct_rules
        exec: goto china_dns
      - matches:
          - qname $proxy_rules
        exec: goto proxy_dns_seq
      - matches:
          - qname $direct_rules_2
        exec: goto china_dns
      - matches:
          - qname $cn
        exec: goto china_dns
      - matches:
          - qname $mixed
        exec: goto proxy_dns_seq
      - exec: query_summary forward_local
      - exec: $forward_local
      - matches:
          - resp_ip $direct_ip_rules
        exec: accept
      - matches:
          - resp_ip $proxy_ip_rules
        exec: goto ip_requery_proxy
      - matches:
          - resp_ip $mixed_ip
        exec: goto ip_requery_proxy
      - matches:
          - resp_ip $ips
        exec: goto ip_requery_proxy
      - exec: drop_resp
      - exec: goto proxy_dns_seq
  - type: udp_server
    args:
      entry: sequence_main
      listen: :53
  - type: tcp_server
    args:
      entry: sequence_main
      listen: :53
