version: '3.8'

services:
  config-flow:
    image: thsrite/config-flow:latest
    # 如果要使用本地构建，请注释上一行并取消下面的注释
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile
    container_name: config-flow
    ports:
      - "5010:80"
    volumes:
      # 挂载数据目录以持久化配置（不包含应用代码）
      - ./data:/data
      # 挂载后端源码，方便直接修改代码调试（取消注释即可使用）
      # - ./backend:/app/backend
    restart: unless-stopped
    depends_on:
      - sub-store
    environment:
      - DATA_DIR=/data
      - SUB_STORE_URL=http://sub-store:3001
      # 登录认证配置（可选：不设置则不需要登录，设置后才开启认证）
      # 需要登录时取消下面三行注释，并改成自己的用户名/密码/密钥
      # - ADMIN_USERNAME=admin
      # - ADMIN_PASSWORD=your-secure-password
      # - JWT_SECRET_KEY=your-unique-secret-key-at-least-32-chars

  sub-store:
    image: xream/sub-store:latest
    container_name: config-flow-sub-store
    restart: unless-stopped
    volumes:
      - ./sub-store-data:/root/sub-store-data
    environment:
      - SUB_STORE_BACKEND_API_PORT=3001
