[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/configflow-ha-supervisord.pid
childlogdir=/run

[unix_http_server]
file=/var/lib/configflow-ha/run/supervisor.sock
chmod=0600
chown=root:root

[supervisorctl]
serverurl=unix:///var/lib/configflow-ha/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; This socket controls keepalived only, never the Agent or DNS core.
[include]
files=/etc/supervisor/conf.d/configflow-keepalived.conf
