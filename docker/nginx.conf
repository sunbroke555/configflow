user  nginx;
# 控制台只有少量并发：auto 会按宿主机核数起 worker（多核机器上十几个），白占内存。
worker_processes  2;

# 日志交给容器标准输出，由 Docker 轮转，不在容器里无限增长。
error_log  stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # 页面每 2 秒轮询接口，成功请求不记访问日志，只保留 4xx/5xx 便于排查。
    map $status $loggable {
        ~^[23]  0;
        default 1;
    }
    access_log  /dev/stdout  main  if=$loggable;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 60s;

    # 镜像构建时已预压缩前端资源，直接发送 .gz，免去每次请求现场压缩。
    gzip_static on;
    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # 复用到后端的连接，轮询接口不必每次重新建立 TCP 连接。
    upstream configflow_backend {
        server 127.0.0.1:5001;
        keepalive 8;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        # 入口在每次打开时重新校验，避免部署后继续引用已删除的旧脚本。
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }

        location = /frontend-version.json {
            try_files $uri @static_not_found;
            add_header Cache-Control "no-store" always;
        }

        # 只有文件名带内容哈希的构建资源允许长期缓存。
        location ~ "^/assets/.+-[A-Za-z0-9_-]{8,}\.[^/]+$" {
            try_files $uri @static_not_found;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /assets/ {
            try_files $uri @static_not_found;
            add_header Cache-Control "no-cache" always;
        }

        # Service Worker、注册脚本等无版本号文件需要检查更新；缺失文件不能返回 SPA HTML。
        location ~ ^/(?!api(?:/|$)|mcp(?:/|$)).*\.(?:m?js|css|json|map|webmanifest|ico|png|svg|woff2?)$ {
            try_files $uri @static_not_found;
            add_header Cache-Control "no-cache" always;
        }

        location @static_not_found {
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 404 "Static file not found\n";
        }

        # OxiDNS 的附加文件允许 64 MiB 原始内容，Base64 编码后约 86 MiB。
        # 仅为认证的设置/草稿接口放宽上传上限，其他 API 保持默认限制。
        location ~ ^/api/(?:profiles/[^/]+/)?oxidns/(?:settings|render)$ {
            client_max_body_size 96m;
            proxy_pass http://configflow_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # API 代理到后端 Flask
        location /api/ {
            proxy_pass http://configflow_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # 超时设置：生成配置时可能要现拉订阅，60s 不够
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # MCP 端点代理到后端 Flask
        location /mcp {
            proxy_pass http://configflow_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # 工具调用可能涉及订阅拉取、规则连通性测试等耗时操作，超时放宽
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        # 健康检查
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
