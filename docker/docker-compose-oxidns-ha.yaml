# Run one copy on each of two different Linux hosts on the same LAN.
# Change SERVER_URL, AGENT_IP and names for each host. AGENT_IP is not the VIP.
services:
  agent:
    image: thsrite/config-flow-agent:latest
    container_name: configflow-oxidns
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 30s
    depends_on:
      - ha-companion
    environment:
      SERVICE_TYPE: oxidns
      SERVER_URL: http://192.168.1.10:5010
      AGENT_NAME: dns-a
      AGENT_IP: 192.168.1.21
      AGENT_PORT: "8082"
      CONFIGFLOW_DNS_HA: "1"
      CONFIGFLOW_DNS_HA_NETWORK: host
      TZ: Asia/Shanghai
    volumes:
      - ./agent:/opt/configflow-agent
      - ./oxidns:/etc/oxidns
      - ./ha:/var/lib/configflow-ha
      - type: bind
        source: /etc/machine-id
        target: /run/configflow-host-machine-id
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /proc/1/ns/net
        target: /run/configflow-host-netns
        read_only: true
        bind: {create_host_path: false}

  ha-companion:
    image: thsrite/config-flow-agent:latest
    container_name: configflow-oxidns-ha
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 30s
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      SERVICE_TYPE: ha-companion
      CONFIGFLOW_DNS_HA: "1"
      CONFIGFLOW_DNS_HA_NETWORK: host
      TZ: Asia/Shanghai
    volumes:
      - ./agent:/opt/configflow-agent:ro
      - ./oxidns:/etc/oxidns:ro
      - ./ha:/var/lib/configflow-ha
      - type: bind
        source: /etc/machine-id
        target: /run/configflow-host-machine-id
        read_only: true
        bind: {create_host_path: false}
